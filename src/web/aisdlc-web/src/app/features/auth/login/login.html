<aisdlc-auth-layout>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <header>
      <h2>Welcome back</h2>
      <p class="sub">Sign in to continue to your projects.</p>
    </header>

    @if (errorMessage(); as message) {
      <div class="alert alert-error" role="alert">
        <aisdlc-icon name="alert" />
        <span>{{ message }}</span>
      </div>
    }

    <div class="field">
      <label for="email">Email</label>
      <div class="input-wrap">
        <aisdlc-icon name="mail" />
        <input
          id="email"
          class="input"
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="you@company.com"
          [attr.aria-invalid]="showError('email')"
          [attr.aria-describedby]="showError('email') ? 'email-error' : null"
        />
      </div>
      @if (showError('email')) {
        <span id="email-error" class="error">Enter a valid email address.</span>
      }
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <aisdlc-icon name="lock" />
        <input
          id="password"
          class="input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Your password"
          [attr.aria-invalid]="showError('password')"
          [attr.aria-describedby]="showError('password') ? 'password-error' : null"
        />
      </div>
      @if (showError('password')) {
        <span id="password-error" class="error">Enter your password.</span>
      }
    </div>

    <button type="submit" class="btn btn-primary submit" [disabled]="submitting()">
      <aisdlc-icon name="log-in" />
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="switch">New here? <a routerLink="/register">Create an account</a></p>
  </form>
</aisdlc-auth-layout>
